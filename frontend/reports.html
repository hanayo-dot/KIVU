<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Reports - KIVU Command Centre</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Persistent Sidebar -->
      <aside class="sidebar">
        <div class="logo">KIVU</div>
        <nav>
          <a href="analytics.html" class="nav-item">Analytics</a>
          <a href="alerts.html" class="nav-item">Alerts</a>
          <a href="reports.html" class="nav-item active">Farm Reports</a>
          <a href="maps.html" class="nav-item">Interactive Map</a>
          <a href="settings.html" class="nav-item">Settings</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <select class="farm-dropdown">
            <option>Current Farm: My Farm</option>
          </select>
        </header>

        <div style="width: 100%">
          <div class="card" style="position: relative">
            <h2 style="margin-bottom: 20px">Report an Observation</h2>

            <form
              id="observation-form"
              style="display: flex; flex-direction: column; gap: 20px"
            >
              <div class="form-group">
                <label>Select Cage</label>
                <select style="padding: 12px; border-radius: 8px">
                  <option>Cage 01</option>
                  <option selected>Cage 02</option>
                  <option>Cage 03</option>
                </select>
              </div>

              <!-- Category Selector Cards -->
              <div class="form-group">
                <label>Category</label>
                <div
                  style="
                    display: grid;
                    grid-template-columns: repeat(5, 1fr);
                    gap: 10px;
                  "
                >
                  <div
                    class="cat-card-option"
                    style="
                      background: rgba(4, 15, 28, 0.6);
                      border: 1px solid var(--card-border);
                      padding: 15px 10px;
                      border-radius: 8px;
                      text-align: center;
                      cursor: pointer;
                    "
                  >
                    <div style="margin-bottom: 5px">
                      <i data-lucide="fish" style="width: 24px; height: 24px;"></i>
                    </div>
                    <div style="font-size: 0.75rem">Fish Stress</div>
                  </div>
                  <div
                    class="cat-card-option active-red"
                    style="
                      background: rgba(4, 15, 28, 0.6);
                      border: 1px solid var(--accent-red);
                      padding: 15px 10px;
                      border-radius: 8px;
                      text-align: center;
                      cursor: pointer;
                      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
                    "
                  >
                    <div style="margin-bottom: 5px">
                      <i data-lucide="skull" style="width: 24px; height: 24px; color: var(--accent-red);"></i>
                    </div>
                    <div style="font-size: 0.75rem">Fish Mortality</div>
                  </div>
                  <div
                    class="cat-card-option"
                    style="
                      background: rgba(4, 15, 28, 0.6);
                      border: 1px solid var(--card-border);
                      padding: 15px 10px;
                      border-radius: 8px;
                      text-align: center;
                      cursor: pointer;
                    "
                  >
                    <div style="margin-bottom: 5px">
                      <i data-lucide="droplets" style="width: 24px; height: 24px; color: #38bdf8;"></i>
                    </div>
                    <div style="font-size: 0.75rem">Water Discoloration</div>
                  </div>
                  <div
                    class="cat-card-option"
                    style="
                      background: rgba(4, 15, 28, 0.6);
                      border: 1px solid var(--card-border);
                      padding: 15px 10px;
                      border-radius: 8px;
                      text-align: center;
                      cursor: pointer;
                    "
                  >
                    <div style="margin-bottom: 5px">
                      <i data-lucide="sprout" style="width: 24px; height: 24px; color: var(--accent-emerald);"></i>
                    </div>
                    <div style="font-size: 0.75rem">Algal Growth</div>
                  </div>
                  <div
                    class="cat-card-option"
                    style="
                      background: rgba(4, 15, 28, 0.6);
                      border: 1px solid var(--card-border);
                      padding: 15px 10px;
                      border-radius: 8px;
                      text-align: center;
                      cursor: pointer;
                    "
                  >
                    <div style="margin-bottom: 5px">
                      <i data-lucide="waves" style="width: 24px; height: 24px; color: #38bdf8;"></i>
                    </div>
                    <div style="font-size: 0.75rem">Unusual Water</div>
                  </div>
                </div>
              </div>

              <!-- Severity Selector -->
              <div class="form-group">
                <label>Severity</label>
                <div
                  class="severity-seg"
                  style="
                    display: flex;
                    background: rgba(4, 15, 28, 0.8);
                    border: 1px solid var(--card-border);
                    border-radius: 8px;
                    padding: 4px;
                  "
                >
                  <div
                    class="severity-seg-item active"
                    style="
                      flex: 1;
                      text-align: center;
                      padding: 8px;
                      border-radius: 6px;
                      font-size: 0.85rem;
                      cursor: pointer;
                      background: rgba(34, 197, 94, 0.2);
                      color: var(--accent-emerald);
                    "
                  >
                    Low
                  </div>
                  <div
                    class="severity-seg-item"
                    style="
                      flex: 1;
                      text-align: center;
                      padding: 8px;
                      border-radius: 6px;
                      font-size: 0.85rem;
                      cursor: pointer;
                      color: var(--text-muted);
                    "
                  >
                    Medium
                  </div>
                  <div
                    class="severity-seg-item"
                    style="
                      flex: 1;
                      text-align: center;
                      padding: 8px;
                      border-radius: 6px;
                      font-size: 0.85rem;
                      cursor: pointer;
                      color: var(--text-muted);
                    "
                  >
                    High
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label>Photo (Optional)</label>
                <div
                  style="
                    border: 2px dashed var(--card-border);
                    padding: 20px;
                    text-align: center;
                    border-radius: 8px;
                    color: var(--text-muted);
                    font-size: 0.85rem;
                    cursor: pointer;
                  "
                >
                  + Upload Photo (Optional)
                </div>
              </div>

              <div class="form-group">
                <label>Description</label>
                <textarea
                  rows="3"
                  placeholder="Describe what you observed..."
                  style="
                    background: rgba(4, 15, 28, 0.6);
                    border: 1px solid var(--card-border);
                    padding: 12px;
                    border-radius: 8px;
                    color: var(--text-main);
                  "
                ></textarea>
              </div>

              <!-- Toast Popup Notification -->
              <div
                id="success-toast"
                class="toast-popup"
                style="
                  display: none;
                  background: rgba(16, 185, 129, 0.15);
                  border: 1px solid #34d399;
                  padding: 12px 16px;
                  border-radius: 8px;
                  align-items: center;
                  gap: 12px;
                "
              >
                <i data-lucide="check-circle-2" style="width: 22px; height: 22px; color: #34d399;"></i>
                <div>
                  <div style="font-weight: 600; font-size: 0.9rem">
                    Observation recorded.
                  </div>
                  <div style="font-size: 0.75rem; color: #a7f3d0">
                    Your report has been added to KIVU's intelligence layer.
                  </div>
                </div>
              </div>

              <button type="submit" class="btn-primary">
                Submit Observation
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
  </body>
</html>
