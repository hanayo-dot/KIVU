<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIVU - Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card animate-up">
      <div
        class="logo"
        style="text-align: center; margin-bottom: 10px; letter-spacing: 3px"
      >
        KIVU
      </div>
      <h2
        style="
          text-align: center;
          font-size: 1.3rem;
          margin-bottom: 25px;
          color: var(--text-main);
        "
      >
        Manager Portal Login
      </h2>

      <form
        id="login-form"
        style="display: flex; flex-direction: column; gap: 20px"
      >
        <div class="form-group">
          <label style="font-size: 0.85rem; color: var(--text-muted)"
            >Email Address</label
          >
          <input
            type="email"
            id="login-email"
            placeholder="manager@kivu.com"
            required
          />
        </div>

        <div class="form-group">
          <label style="font-size: 0.85rem; color: var(--text-muted)"
            >Password</label
          >
          <input type="password" placeholder="••••••••" required />
        </div>

        <button
          type="submit"
          class="btn-primary"
          style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem"
        >
          Sign In
        </button>
      </form>
    </div>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("login-email").value;

          // Extract a clean name from the email prefix (e.g., "sarah.jones@kivu.com" -> "Sarah Jones")
          let namePart = email.split("@")[0];
          let formattedName = namePart
            .split(".")
            .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");

          // Save user session details
          localStorage.setItem("farmerName", formattedName);
          localStorage.setItem("farmerEmail", email);

          // Redirect to dashboard
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
