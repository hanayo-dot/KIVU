<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AquaAI Command Centre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h2>AQUA AI COMMAND</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Farm Operator Email</label>
                <input type="email" id="email" required value="farmer@lakeview.com">
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" id="password" required value="password123">
            </div>
            <button type="submit" class="btn-primary">Authenticate Session</button>
        </form>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
