<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - KIVU Command Centre</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <div class="logo" style="text-align: center; margin-bottom: 20px">
        KIVU
      </div>
      <h2>KIVU AQUACULTURE INTELLIGENCE</h2>
      <div
        id="error-msg"
        style="
          color: var(--accent-red);
          margin-bottom: 12px;
          font-size: 0.9rem;
          display: none;
        "
      ></div>
      <form id="login-form">
        <div class="form-group">
          <label>Farmer Phone Number</label>
          <input
            type="text"
            id="phone"
            required
            value="+254700000000"
            placeholder="+254700000000"
          />
        </div>
        <div class="form-group">
          <label>Security Password</label>
          <input
            type="password"
            id="password"
            required
            value="demo1234"
            placeholder="••••••••"
          />
        </div>
        <button type="submit" class="btn-primary">Authenticate Session</button>
      </form>
    </div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
