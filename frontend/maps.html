<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Map - KIVU Command Centre</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Persistent Sidebar -->
      <aside class="sidebar">
        <div class="logo">KIVU</div>
        <nav>
          <a href="index.html" class="nav-item">Dashboard</a>
          <a href="analytics.html" class="nav-item">Analytics</a>
          <a href="alerts.html" class="nav-item">Alerts</a>
          <a href="reports.html" class="nav-item">Farm Reports</a>
          <a href="maps.html" class="nav-item">Interactive Map</a>
          <a href="settings.html" class="nav-item">Settings</a>
        </nav>
      </aside>
      <main class="main-content">
        <!-- Top Bar Context -->
        <header class="top-bar">
          <select class="farm-dropdown">
            <option>Current Farm: My Farm</option>
          </select>
          <div style="display: flex; align-items: center; gap: 20px">
            <span
              style="font-size: 1.1rem; cursor: pointer"
              title="Notifications"
              >🔔 3</span
            >
            <div class="user-profile">
              <span style="font-size: 1.2rem">👤</span>
              <span>Farmer John</span>
              <span class="user-status-dot"></span>
            </div>
          </div>
        </header>

        <!-- Map Layout -->
        <div
          style="
            padding: 30px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: calc(100vh - 70px);
          "
        >
          <div class="card">
            <h3>Map Layers</h3>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-top: 15px;
                font-size: 0.9rem;
                color: var(--text-muted);
              "
            >
              <label
                ><input type="checkbox" checked /> Water Quality
                Telemetry</label
              >
              <label
                ><input type="checkbox" checked /> Regional Risk Zones</label
              >
              <label
                ><input type="checkbox" checked /> Active Cage Arrays</label
              >
              <label><input type="checkbox" /> Historical Incidents</label>
            </div>
          </div>
          <div
            style="
              background: #070d1d;
              border-radius: 12px;
              border: 1px solid var(--card-border);
              display: flex;
              align-items: center;
              justify-content: center;
              position: relative;
              overflow: hidden;
            "
          >
            <div style="text-align: center; color: var(--text-muted)">
              <div style="font-size: 2rem; margin-bottom: 8px">📍</div>
              <strong>Lake Victoria Aquaculture Sector Grid</strong>
              <p style="font-size: 0.8rem; margin-top: 4px">
                Live sensor clusters operational
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
