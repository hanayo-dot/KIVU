<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Map - KIVU Command Centre</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Persistent Sidebar -->
      <aside class="sidebar">
        <div class="logo">KIVU</div>
        <nav>
          <a href="analytics.html" class="nav-item">Analytics</a>
          <a href="alerts.html" class="nav-item">Alerts</a>
          <a href="reports.html" class="nav-item">Farm Reports</a>
          <a href="maps.html" class="nav-item active">Interactive Map</a>
          <a href="settings.html" class="nav-item">Settings</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <select class="farm-dropdown">
            <option>Current Farm: My Farm</option>
          </select>
        </header>

        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: calc(100vh - 120px);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div>
              <h2 style="font-size: 1.4rem; margin-bottom: 4px">
                Lake Victoria Sector Grid Map
              </h2>
              <p style="font-size: 0.85rem; color: var(--text-muted)">
                Real-time telemetry and physical spatial layout of aquaculture
                cages.
              </p>
            </div>
          </div>

          <!-- Map Viewport Card -->
          <div
            class="card"
            style="
              flex: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              border: 1px dashed var(--card-border);
              position: relative;
              overflow: hidden;
            "
          >
            <div
              style="
                text-align: center;
                color: var(--text-muted);
                display: flex;
                flex-direction: column;
                gap: 10px;
              "
            >
              <span style="font-size: 3rem">🗺️</span>
              <div
                style="
                  font-size: 1.1rem;
                  font-weight: 600;
                  color: var(--text-main);
                "
              >
                Spatial Telemetry Grid Loaded
              </div>
              <p style="font-size: 0.85rem; max-width: 400px">
                Interactive map layer tracking Cage 01 (Optimal), Cage 02
                (Oxygen Warning), and Cage 03 (Healthy).
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
