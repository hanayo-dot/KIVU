<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings & Profile - KIVU Command Centre</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Persistent Sidebar -->
      <aside class="sidebar">
        <div class="logo">KIVU</div>
        <nav>
          <a href="analytics.html" class="nav-item">Analytics</a>
          <a href="alerts.html" class="nav-item">Alerts</a>
          <a href="reports.html" class="nav-item">Farm Reports</a>
          <a href="maps.html" class="nav-item">Interactive Map</a>
          <a href="settings.html" class="nav-item active">Settings</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <select class="farm-dropdown">
            <option>Current Farm: My Farm</option>
          </select>
          <div style="display: flex; align-items: center; gap: 15px">
            <span style="font-size: 0.9rem; color: var(--text-muted)"
              >🔔 3</span
            >
            <span
              id="topbar-username"
              style="
                font-size: 0.9rem;
                color: var(--text-main);
                font-weight: 500;
              "
              >👤 Farmer John</span
            >
          </div>
        </header>

        <!-- Centered, Comfortably Sized Settings Container -->
        <div style="max-width: 800px; margin: 0 auto; width: 100%">
          <div style="margin-bottom: 20px">
            <h2 style="font-size: 1.4rem; margin-bottom: 4px">
              Account Settings
            </h2>
            <p style="font-size: 0.85rem; color: var(--text-muted)">
              Manage your profile credentials and operational preferences.
            </p>
          </div>

          <!-- Success Notification Banner (Hidden by default) -->
          <div
            id="success-banner"
            style="
              display: none;
              background: rgba(34, 197, 94, 0.2);
              border: 1px solid var(--accent-emerald);
              color: var(--accent-emerald);
              padding: 12px 16px;
              border-radius: 8px;
              margin-bottom: 15px;
              font-weight: 700;
              font-size: 0.9rem;
            "
          >
            ✓ Changes saved successfully!
          </div>

          <div class="card" style="position: relative">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 24px;
                border-bottom: 1px solid var(--card-border);
                padding-bottom: 20px;
              "
            >
              <div
                style="
                  width: 48px;
                  height: 48px;
                  border-radius: 50%;
                  background: rgba(34, 197, 94, 0.2);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 1.2rem;
                  color: var(--accent-emerald);
                "
              >
                👤
              </div>
              <div>
                <h3
                  id="profile-card-name"
                  style="font-size: 1.1rem; margin-bottom: 2px"
                >
                  Farmer John
                </h3>
                <span
                  style="
                    font-size: 0.75rem;
                    color: var(--accent-emerald);
                    font-weight: 600;
                  "
                  >Online • Farm Manager</span
                >
              </div>
            </div>

            <form
              id="settings-form"
              style="display: flex; flex-direction: column; gap: 20px"
            >
              <div
                class="form-group"
                style="display: flex; flex-direction: column; gap: 6px"
              >
                <label style="font-size: 0.85rem; color: var(--text-muted)"
                  >Full Name</label
                >
                <input
                  id="input-name"
                  type="text"
                  value="Farmer John"
                  style="
                    background: rgba(4, 15, 28, 0.6);
                    border: 1px solid var(--card-border);
                    padding: 12px;
                    border-radius: 8px;
                    color: var(--text-main);
                    font-size: 0.9rem;
                  "
                />
              </div>

              <div
                class="form-group"
                style="display: flex; flex-direction: column; gap: 6px"
              >
                <label style="font-size: 0.85rem; color: var(--text-muted)"
                  >Email Address</label
                >
                <input
                  id="input-email"
                  type="email"
                  value="farmer@lakeview.com"
                  style="
                    background: rgba(4, 15, 28, 0.6);
                    border: 1px solid var(--card-border);
                    padding: 12px;
                    border-radius: 8px;
                    color: var(--text-main);
                    font-size: 0.9rem;
                  "
                />
              </div>

              <div
                class="form-group"
                style="display: flex; flex-direction: column; gap: 6px"
              >
                <label style="font-size: 0.85rem; color: var(--text-muted)"
                  >Assigned Sector</label
                >
                <input
                  id="input-sector"
                  type="text"
                  value="Lake Victoria Sector Grid 04"
                  style="
                    background: rgba(4, 15, 28, 0.6);
                    border: 1px solid var(--card-border);
                    padding: 12px;
                    border-radius: 8px;
                    color: var(--text-main);
                    font-size: 0.9rem;
                  "
                />
              </div>

              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  margin-top: 10px;
                "
              >
                <a
                  href="login.html"
                  style="
                    background: transparent;
                    border: 1px solid var(--accent-red);
                    color: var(--accent-red);
                    padding: 10px 20px;
                    border-radius: 8px;
                    font-size: 0.9rem;
                    text-decoration: none;
                    display: inline-block;
                    font-weight: 600;
                    text-align: center;
                  "
                >
                  Log Out
                </a>
                <button
                  type="submit"
                  class="btn-primary"
                  style="width: auto; padding: 10px 24px"
                >
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <!-- Script to handle saving changes -->
    <script>
      // Load saved values on page load if they exist
      document.addEventListener("DOMContentLoaded", () => {
        const savedName = localStorage.getItem("farmerName");
        const savedEmail = localStorage.getItem("farmerEmail");
        const savedSector = localStorage.getItem("farmerSector");

        if (savedName) {
          document.getElementById("input-name").value = savedName;
          document.getElementById("profile-card-name").textContent = savedName;
          document.getElementById("topbar-username").textContent =
            "👤 " + savedName;
        }
        if (savedEmail)
          document.getElementById("input-email").value = savedEmail;
        if (savedSector)
          document.getElementById("input-sector").value = savedSector;
      });

      // Handle form submission
      document
        .getElementById("settings-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const nameVal = document.getElementById("input-name").value;
          const emailVal = document.getElementById("input-email").value;
          const sectorVal = document.getElementById("input-sector").value;

          // Save into localStorage
          localStorage.setItem("farmerName", nameVal);
          localStorage.setItem("farmerEmail", emailVal);
          localStorage.setItem("farmerSector", sectorVal);

          // Update UI instantly
          document.getElementById("profile-card-name").textContent = nameVal;
          document.getElementById("topbar-username").textContent =
            "👤 " + nameVal;

          // Show success notification banner
          const banner = document.getElementById("success-banner");
          banner.style.display = "block";

          setTimeout(() => {
            banner.style.display = "none";
          }, 3000);
        });
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
